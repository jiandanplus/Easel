<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Keep normalization in sync with src/lib/theme.ts before styles load.
      (function () {
        var theme;
        try { theme = localStorage.getItem('easel_theme'); } catch (_) { /* Storage may be unavailable. */ }
        if (['paper', 'minimal', 'forest', 'pastel', 'swiss'].indexOf(theme) === -1) theme = 'paper';
        try { localStorage.setItem('easel_theme', theme); } catch (_) { /* Apply this visit. */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'forest' ? 'dark' : 'light';
      })();
    </script>
    <script>
      // 子路径代理下必须带结尾斜杠，否则相对资源路径(./assets)会解析到上一级 → 404 白屏。
      // 若当前路径无结尾斜杠且末段不像文件名(无扩展名)，自动补斜杠后重载。
      (function () {
        var p = location.pathname;
        var last = p.split('/').pop();
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(last)) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="./static/easel-icon-transparent.png" />
    <!-- Typography uses local font stacks; no external font request is required. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
