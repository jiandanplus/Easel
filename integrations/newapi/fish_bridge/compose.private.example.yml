# Deployment template only. No service has been started in this task.
services:
  fish-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    ports: []
    expose:
      - "8787"
    command: ["uvicorn", "app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8787", "--workers", "1", "--limit-concurrency", "16", "--backlog", "32", "--no-access-log"]
    volumes:
      - fish-private-data:/data
    networks:
      - newapi-private
      - fish-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  newapi-private:
    name: easel-newapi-private
    internal: true
  fish-egress:
    driver: bridge
volumes:
  fish-private-data:
