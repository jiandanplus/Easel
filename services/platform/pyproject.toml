[project]
name = "easel-central-platform"
version = "0.1.0"
description = "Independent central identity and shared credit service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "qrcode>=8.2,<9",
  "Pillow==12.3.0",
  "PyNaCl==1.6.2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_service"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "platform_service/console_static"
"scripts/media_backup/__init__.py" = "media_backup/__init__.py"
"scripts/media_backup/closure.py" = "media_backup/closure.py"
"scripts/media_backup/contract.py" = "media_backup/contract.py"
"scripts/media_backup/files.py" = "media_backup/files.py"
"scripts/media_backup/ustar.py" = "media_backup/ustar.py"
"licenses/Pillow-12.3.0-LICENSE.txt" = "platform_service/licenses/Pillow-12.3.0-LICENSE.txt"
"licenses/PyNaCl-1.6.2-LICENSE.txt" = "platform_service/licenses/PyNaCl-1.6.2-LICENSE.txt"
"licenses/libsodium-LICENSE.txt" = "platform_service/licenses/libsodium-LICENSE.txt"
"licenses/PyNaCl-1.6.2-provenance.json" = "platform_service/licenses/PyNaCl-1.6.2-provenance.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
