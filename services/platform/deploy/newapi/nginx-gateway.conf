# Loopback only: the central service reaches the gateway at
# https://api.drawbookai.cn:19443, and /etc/hosts points that name at 127.0.0.1.
server {
listen 127.0.0.1:19443 ssl;
server_name api.drawbookai.cn;
ssl_certificate /etc/letsencrypt/live/easel-gateway/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/easel-gateway/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
access_log off;
error_log /dev/null;
client_max_body_size 64m;
location / {
proxy_pass http://127.0.0.1:19880;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host api.drawbookai.cn;
proxy_set_header X-Forwarded-Proto https;
proxy_buffering off;
proxy_read_timeout 330s;
proxy_send_timeout 330s;
send_timeout 330s;
}
}
