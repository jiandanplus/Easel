# Public admin page. nginx owns ports 80 and 443 here, so it forwards this name to the
# 1Panel website (OpenResty on 18480/18443, closed to the outside by easel-1panel-guard).
# 1Panel issues the certificate and pushes it to /srv/easel/panel-cert.
# The nginx password comes first, so New API's own login page and API cannot be reached
# without it. The central service stays on 127.0.0.1:19443.
server {
listen 80;
server_name api.drawbookai.cn;
access_log off;
error_log /dev/null;
# certbot answers from the webroot; anything else goes to the 1Panel website, which holds its own challenge files.
location /.well-known/acme-challenge/ { root /srv/easel/acme; try_files $uri @panel; }
location @panel {
proxy_pass http://127.0.0.1:18480;
proxy_set_header Host api.drawbookai.cn;
}
location / { return 308 https://api.drawbookai.cn$request_uri; }
}

server {
listen 443 ssl;
server_name api.drawbookai.cn;
ssl_certificate /srv/easel/panel-cert/fullchain.pem;
ssl_certificate_key /srv/easel/panel-cert/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
access_log off;
error_log /dev/null;
if ($host != api.drawbookai.cn) { return 421; }
client_max_body_size 8m;
auth_basic "Restricted";
auth_basic_user_file /etc/nginx/easel-gateway-console.htpasswd;
location / {
proxy_pass https://127.0.0.1:18443;
proxy_ssl_server_name on;
proxy_ssl_name api.drawbookai.cn;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host api.drawbookai.cn;
proxy_set_header Authorization "";
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_buffering off;
proxy_read_timeout 330s;
proxy_send_timeout 330s;
send_timeout 330s;
}
}
