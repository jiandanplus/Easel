<script>

function render(){if(!spec)return;const page=spec.pages.find(p=>p.id===current);document.getElementById('progress').textContent=`已保存 ${report.available} / 110 张单页图 · 5 套方向 × 22 个页面`;document.getElementById('pageTitle').textContent=current+' '+page.title;document.getElementById('pageSub').textContent=page.group+' · '+(mode==='single'?'单页查看，可点击图片放大':'同一页面的五套方向并排比较');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));document.getElementById('single').classList.toggle('active',mode==='single');document.getElementById('compare').classList.toggle('active',mode==='compare');document.getElementById('prev').disabled=current==='01';document.getElementById('next').disabled=current==='22';cards.classList.toggle('compare',mode==='compare');cards.replaceChildren();const selected=mode==='compare'?spec.variants:spec.variants.filter(v=>v.id===variant);selected.forEach(v=>{const record=report.records.find(r=>r.variant===v.id&&r.page===current),card=document.createElement('article');card.className='card';const path=v.id+'/'+current+'.png';const badge=record?(record.ocrMissingLabels?.length?'关键文案需复核':'关键文案已核对'):'生成中';card.innerHTML=`<div class="cardhead"><strong>${esc(v.id+' · '+v.name)}</strong><span class="badge ${record?.ocrMissingLabels?.length?'review':''}">${badge}</span></div>`;if(record){const image=document.createElement('img');image.src=path+'?v='+record.bytes;image.alt=v.id+' '+v.name+' '+page.title;image.onclick=()=>{document.getElementById('full').src=image.src;document.getElementById('viewerTitle').textContent=v.id+' '+v.name+' · '+page.title;canvas.classList.remove('native');document.getElementById('native').textContent='原生尺寸';viewer.showModal()};card.append(image);const footer=document.createElement('footer');footer.className='cardfooter';footer.innerHTML=`<a href="${path}" target="_blank">打开原图 ↗</a><a h
